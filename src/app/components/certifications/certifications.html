<section id="skills" class="py-24 bg-[#0D0D12] relative">
  <div class="w-full max-w-7xl mx-auto px-6 lg:px-12">
    <!-- Section Header -->
    <div class="text-center mb-16">
      <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">Certifications</h2>
      <p class="text-[#797876] max-w-2xl mx-auto">
        Verified credentials and continuous learning journey
      </p>
    </div>

    <!-- Certifications Grid -->
    <div class="grid md:grid-cols-2 gap-6 mb-12">
      @for (cert of certifications; track cert.title) {
        <div class="p-6 rounded-lg bg-[#1A1A24] border border-[#2A2A35] hover:border-[#4F98A3] transition-all group">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-md flex items-center justify-center shrink-0" [style.background]="cert.color + '20'">
              <lucide-icon [name]="Award" [size]="24" [style.color]="cert.color"></lucide-icon>
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="text-base font-bold text-white mb-1 group-hover:text-[#4F98A3] transition-colors">{{ cert.title }}</h3>
              <p class="text-sm text-[#797876] mb-3">{{ cert.issuer }}</p>
              <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1 text-xs text-[#6DBF8F]">
                  <lucide-icon [name]="CheckCircle" [size]="12"></lucide-icon>
                  Verified
                </span>
                @if (cert.credentialUrl) {
                  <a [href]="cert.credentialUrl" target="_blank" class="text-xs text-[#4F98A3] hover:underline inline-flex items-center gap-1">
                    View Credential
                    <lucide-icon [name]="ExternalLink" [size]="10"></lucide-icon>
                  </a>
                }
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- LinkedIn CTA -->
    <div class="text-center">
      <button (click)="openLinkedIn()"
        class="inline-flex items-center gap-3 px-6 py-3 rounded-md bg-[#1A1A24] border border-[#2A2A35] text-[#797876] hover:text-[#0077b5] hover:border-[#0077b5] transition-all">
        <lucide-icon [name]="Linkedin" [size]="18"></lucide-icon>
        <span>View more certifications on LinkedIn</span>
        <lucide-icon [name]="ExternalLink" [size]="16"></lucide-icon>
      </button>
    </div>
  </div>
</section>
