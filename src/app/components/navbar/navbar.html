<nav
  class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.glass]="isScrolled()"
  [class.bg-transparent]="!isScrolled()"
  [class.border-b]="isScrolled()"
  [class.border-[#2A2A35]]="isScrolled()">

  <div class="w-full max-w-7xl mx-auto px-6 lg:px-12">
    <div class="flex items-center justify-between h-20">
      <!-- Logo -->
      <a href="#home" (click)="scrollToSection($event, '#home')"
        class="text-xl font-mono text-[#4F98A3] relative group">
        <span class="flex items-center gap-2">
          <lucide-icon [name]="Terminal" [size]="20"></lucide-icon>
          <span>aman.dev</span>
        </span>
      </a>

      <!-- Desktop Navigation -->
      <ul class="hidden md:flex items-center gap-2">
        @for (link of navLinks; track link.name) {
          <li>
            <a [href]="link.href" (click)="scrollToSection($event, link.href)"
              class="px-4 py-2 text-sm font-medium transition-colors"
              [class.text-white]="activeSection() === link.href.replace('#', '')"
              [class.text-[#797876]]="activeSection() !== link.href.replace('#', '')"
              [class.hover.text-white]="activeSection() !== link.href.replace('#', '')">
              {{ link.name }}
            </a>
          </li>
        }
      </ul>

      <!-- Mobile Menu Button -->
      <button class="md:hidden text-white p-2" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <lucide-icon [name]="isMobileMenuOpen() ? X : Menu" [size]="24"></lucide-icon>
      </button>
    </div>

    <!-- Mobile Navigation -->
    @if (isMobileMenuOpen()) {
      <div class="md:hidden py-4 border-t border-[#2A2A35]">
        <ul class="flex flex-col gap-2">
          @for (link of navLinks; track link.name) {
            <li>
              <a [href]="link.href" (click)="scrollToSection($event, link.href)"
                class="block px-4 py-3 text-sm font-medium rounded-md transition-colors"
                [class.bg-[#1A1A24].text-white]="activeSection() === link.href.replace('#', '')"
                [class.text-[#797876].hover.text-white]="activeSection() !== link.href.replace('#', '')">
                {{ link.name }}
              </a>
            </li>
          }
          <li class="pt-2 px-4 flex gap-2">
            <a href="https://github.com/89Aman" target="_blank"
              class="p-2 text-[#797876] hover:text-white transition-colors">
              <lucide-icon [name]="Github" [size]="20"></lucide-icon>
            </a>
            <a href="https://linkedin.com/in/sharmaaman26" target="_blank"
              class="p-2 text-[#797876] hover:text-white transition-colors">
              <lucide-icon [name]="Linkedin" [size]="20"></lucide-icon>
            </a>
          </li>
          <li class="pt-2 px-4">
            <a href="mailto:shasarita23@gmail.com"
              class="inline-block w-full text-center px-4 py-2 bg-[#4F98A3] text-[#0D0D12] rounded-md text-sm font-semibold">
              Let's Talk
            </a>
          </li>
        </ul>
      </div>
    }
  </div>
</nav>
