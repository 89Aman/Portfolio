<section id="contact" class="py-24 bg-[#1a1a1a] min-h-screen flex items-center relative overflow-hidden">
    <!-- Background Decorations -->
    <div
        class="floating-shape absolute left-1/4 top-1/3 w-64 h-64 bg-indigo-500/5 rounded-full blur-3xl pointer-events-none">
    </div>
    <div class="floating-shape absolute right-1/4 bottom-1/3 w-48 h-48 bg-purple-500/5 rounded-full blur-3xl pointer-events-none"
        style="animation-delay: -2s;"></div>

    <div class="w-full max-w-5xl mx-auto px-6 lg:px-12 relative z-10">
        <!-- Section Header -->
        <div class="text-center mb-16 section-reveal">
            <span
                class="inline-block px-4 py-2 bg-[#262626] text-[#a3a3a3] text-sm rounded-full mb-4 hover:scale-105 hover:bg-[#333333] transition-all cursor-default">
                <span class="inline-flex items-center gap-2">
                    <lucide-icon [name]="MessageCircle" [size]="14"></lucide-icon>
                    Let's connect
                </span>
            </span>
            <h2 class="text-4xl md:text-5xl font-bold text-white mb-6">Get In Touch</h2>
            <p class="text-lg text-[#a3a3a3] max-w-2xl mx-auto leading-relaxed">
                I'm always open to discussing new projects, creative ideas, or opportunities
                to be part of your vision. Feel free to reach out!
            </p>
        </div>

        <!-- Contact Cards -->
        <div class="grid md:grid-cols-3 gap-6">
            @for (method of contactMethods; track method.label) {
            <a [href]="method.href" target="_blank"
                class="contact-card group flex flex-col items-center p-8 bg-[#262626] border border-[#333333] rounded-2xl relative overflow-hidden"
                [style.--accent-color]="method.color" (mouseenter)="hoveredIndex = $index"
                (mouseleave)="hoveredIndex = null">

                <!-- Glow Background -->
                <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
                    [style.background]="'radial-gradient(circle at center, ' + method.color + '15 0%, transparent 70%)'">
                </div>

                <!-- Icon Container -->
                <div class="contact-icon w-16 h-16 flex items-center justify-center rounded-xl bg-[#333333] mb-4 relative z-10 transition-all duration-300"
                    [style.backgroundColor]="hoveredIndex === $index ? method.color : '#333333'"
                    [style.boxShadow]="hoveredIndex === $index ? '0 10px 30px ' + method.color + '40' : 'none'">
                    <lucide-icon [name]="method.icon" [size]="28" class="text-white">
                    </lucide-icon>
                </div>

                <span class="text-sm text-[#525252] mb-2 relative z-10 uppercase tracking-wider">{{ method.label
                    }}</span>
                <span
                    class="text-white font-medium flex items-center gap-2 relative z-10 group-hover:text-[#d4d4d4] transition-colors">
                    {{ method.value }}
                    <lucide-icon [name]="ExternalLink" [size]="14"
                        class="link-arrow opacity-0 group-hover:opacity-100 transition-all duration-300">
                    </lucide-icon>
                </span>

                <!-- Corner Accent -->
                <div class="absolute top-0 right-0 w-24 h-24 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
                    [style.background]="'linear-gradient(135deg, transparent 50%, ' + method.color + '15 50%)'">
                </div>
            </a>
            }
        </div>

        <!-- CTA Button -->
        <div class="mt-16 text-center section-reveal" style="animation-delay: 0.3s;">
            <a href="https://mail.google.com/mail/?view=cm&to=shasarita23@gmail.com"
                class="cta-button inline-flex items-center gap-3 px-10 py-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-full font-semibold text-lg hover:from-indigo-600 hover:to-purple-600 group">
                <lucide-icon [name]="Send" [size]="20"
                    class="group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform duration-300">
                </lucide-icon>
                <span>Send me an email</span>
            </a>
        </div>
    </div>
</section>
